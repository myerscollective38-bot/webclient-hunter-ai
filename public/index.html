<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebClient Hunter AI</title>
<style>
:root{--bg:#0d0d11;--s1:#15151b;--s2:#1d1d26;--bd:#2a2a36;--tx:#ececf3;--mu:#8d8da1;--p:#8b5cf6;--b:#3b82f6;--g:#22c55e;--y:#f59e0b;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,sans-serif;display:flex;min-height:100vh}
a{color:var(--b)}h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 12px}.mu{color:var(--mu)}.sm{font-size:13px}
aside{width:230px;background:var(--s1);border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:1.05rem;padding:0 10px 20px;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;color:transparent}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;margin-bottom:2px;transition:.15s}aside a:hover{background:var(--s2);color:var(--tx)}
aside a.on{background:linear-gradient(90deg,#8b5cf633,#3b82f622);color:#fff;box-shadow:inset 2px 0 var(--p)}
main{flex:1;padding:28px;max-width:1200px;min-width:0;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.grid.w{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stat b{display:block;font-size:1.9rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}.f{flex:1;min-width:160px}
button{background:var(--s2);color:var(--tx);border:1px solid var(--bd);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;transition:.15s}button:hover{border-color:var(--p)}
button.pri{background:linear-gradient(90deg,var(--p),var(--b));border:0;font-weight:600}button.pri:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:wait}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bd);color:var(--mu)}.High{color:var(--g);border-color:#22c55e66}.Medium{color:var(--y);border-color:#f59e0b66}.Low{color:var(--r);border-color:#ef444466}
.sc{font-size:1.4rem;font-weight:700}.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b));transition:width .6s}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:14px}tr.cl{cursor:pointer}tr.cl:hover{background:var(--s2)}.ov{overflow-x:auto}
.spin{width:18px;height:18px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:#000b;display:flex;justify-content:flex-end;z-index:20}.modal>div{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:22px;border-left:1px solid var(--bd);animation:sl .25s}@keyframes sl{from{transform:translateX(40px);opacity:0}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--p);padding:10px 18px;border-radius:12px;z-index:30;display:none}
.err{border-color:var(--r)!important}.empty{text-align:center;padding:40px;color:var(--mu)}iframe{width:100%;height:600px;border:1px solid var(--bd);border-radius:12px;background:#fff;transition:width .3s}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px;gap:4px}.logo{display:none}aside a{white-space:nowrap;margin:0}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside><div class="logo">WebClient Hunter AI</div><nav id="nav"></nav></aside>
<main id="main"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=['New Lead','Message Prepared','Contacted','Replied','Interested','Negotiating','Client','Rejected','Follow Up'];
const PAGES={dashboard:'📊 Dashboard',find:'🔎 Find Leads',messages:'✉️ AI Message Generator',demo:'🖥️ Website Demo Builder',saved:'📁 Saved Prospects',followups:'⏰ Follow-ups',settings:'⚙️ Settings'};
const S={leads:[],settings:{},cfg:{},sel:'',variant:0,res:[],f:{q:'',country:'',niche:'',level:'',status:''},msg:null,demo:null};
const COUNTRIES=['USA','United Kingdom','Canada','Australia','Germany','France','Netherlands','Ireland','Switzerland','Sweden','Norway','New Zealand','United Arab Emirates','Spain','Italy','Singapore','South Africa'];
const NICHES=['restaurants','hotels','barbershops','salons','cleaning companies','construction companies','roofing companies','plumbers','electricians','auto repair shops','dentists','gyms','real estate agencies','law firms','clothing stores','photography studios','landscaping businesses','moving companies'];
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');return d}
function toast(t,e){const x=$('#toast');x.textContent=t;x.classList.toggle('err',!!e);x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2600)}
async function copy(t,l){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast((l||'Copied')+' ✓')}
const today=(d=0)=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
const L=id=>S.leads.find(l=>l.id===id);const page=()=>(location.hash.slice(1)||'dashboard');
const contactText=l=>[l.name,l.category,[l.address,l.city,l.country].filter(Boolean).join(', '),l.phone&&'Phone: '+l.phone,l.whatsapp&&'WhatsApp: '+l.whatsapp,l.email&&'Email: '+l.email,l.instagram&&'Instagram: '+l.instagram,l.facebook&&'Facebook: '+l.facebook,l.website&&'Website: '+l.website,'Maps: '+l.mapsUrl].filter(Boolean).join('\n');
const opts=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const leadSel=()=>`<select id="lsel"><option value="">Select a prospect…</option>${S.leads.map(l=>`<option value="${esc(l.id)}" ${l.id===S.sel?'selected':''}>${esc(l.name)} — ${esc(l.city||l.country)} (${l.score})</option>`).join('')}</select>`;
const stLabel={none:'No website','social-only':'Social/listing only',broken:'Broken / unreachable',outdated:'Outdated',ok:'Working website'};
const card=l=>`<div class="card" style="margin:0"><div class="row" style="justify-content:space-between"><b>${esc(l.name)}</b><span class="sc">${l.score}</span></div>
<div class="sm mu">${esc(l.category)} · ${esc(l.city||'')} ${esc(l.country)}</div><div class="row" style="margin:8px 0"><span class="tag ${l.level}">${l.level} potential</span><span class="tag">${stLabel[l.websiteStatus]}</span><span class="tag">${esc(l.status)}</span></div>
<div class="sm mu">${l.why.slice(0,3).map(esc).join(' • ')}</div><div class="row" style="margin-top:12px"><button data-a="open" data-id="${esc(l.id)}">Open</button><button data-a="msg" data-id="${esc(l.id)}">Message</button><button data-a="demo" data-id="${esc(l.id)}">Demo</button></div></div>`;
const bars=(o,t)=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,8),m=Math.max(1,...e.map(x=>x[1]));return `<div class="card"><h2>${t}</h2>${e.map(([k,v])=>`<div class="sm" style="margin-top:8px">${esc(k)} <span class="mu">· ${v}</span></div><div class="bar"><i style="width:${v/m*100}%"></i></div>`).join('')||'<div class="mu sm">No data yet</div>'}</div>`};
const count=(a,f)=>a.reduce((o,l)=>(o[f(l)]=(o[f(l)]||0)+1,o),{});
const R={
dashboard(){const a=S.leads,n=s=>a.filter(l=>s.includes(l.status)).length,pre=['New Lead','Message Prepared'];const contacted=a.filter(l=>!pre.includes(l.status)).length,clients=n(['Client']);
const st=[['Total leads',a.length],['High potential',a.filter(l=>l.level==='High').length],['Contacted',contacted],['Replies',n(['Replied','Interested','Negotiating','Client'])],['Interested',n(['Interested','Negotiating'])],['Clients won',clients],['Conversion',(contacted?Math.round(clients/contacted*100):0)+'%']];
return `<h1>Dashboard</h1><p class="mu">Your prospecting pipeline at a glance.</p>${a.length?'':'<div class="card empty">No leads yet. <br><br><button class="pri" onclick="location.hash=\'find\'">Find your first leads</button></div>'}
<div class="grid">${st.map(([k,v])=>`<div class="card stat" style="margin:0"><span class="mu sm">${k}</span><b>${v}</b></div>`).join('')}</div><br><div class="grid w">${bars(count(a,l=>l.country),'Leads by country')}${bars(count(a,l=>l.category),'Leads by niche')}${bars(count(a,l=>l.status),'Pipeline')}</div>`},
find(){return `<h1>Find Leads</h1><p class="mu">Searches real business listings on OpenStreetMap, then checks each website. Free, no API key needed.</p><div class="card"><div class="row">
<div class="f"><label>Country</label><input id="co" list="cl" value="${esc(S.q?.country||'')}" placeholder="e.g. Germany"><datalist id="cl">${COUNTRIES.map(c=>`<option>${c}`).join('')}</datalist></div>
<div class="f"><label>City (empty = whole country)</label><input id="ci" value="${esc(S.q?.city||'')}" placeholder="e.g. Berlin"></div>
<div class="f"><label>Business niche</label><input id="ni" list="nl" value="${esc(S.q?.niche||'')}" placeholder="e.g. plumbers"><datalist id="nl">${NICHES.map(c=>`<option>${c}`).join('')}</datalist></div>
<div class="f" style="max-width:120px"><label>Results</label><select id="li">${[10,20,30,50].map(n=>`<option ${n===(S.q?.limit||20)}>${n}</option>`).join('')}</select></div></div>
<br><button class="pri" id="go" data-a="search">Find Website Clients</button></div><div id="out">${S.res.length?`<div class="grid w">${S.res.map(card).join('')}</div>`:''}</div>`},
messages(){return `<h1>AI Message Generator</h1><p class="mu">Drafts only — you review and send manually. Mode: <span class="tag">${S.cfg.ai?'Gemini AI':'Template demo mode (add GEMINI_API_KEY for AI)'}</span></p><div class="card"><div class="row"><div class="f">${leadSel()}</div><button class="pri" data-a="gen">Generate messages</button></div></div><div id="mo">${S.msg?msgView():''}</div>`},
demo(){return `<h1>Website Demo Builder</h1><p class="mu">Generates a responsive concept site using only known business info. Testimonials are clearly marked as samples.</p><div class="card"><div class="row"><div class="f">${leadSel()}</div><button class="pri" data-a="mkdemo">Create Website Demo</button></div></div><div id="do">${S.demo?demoView():''}</div>`},
saved(){const f=S.f,a=S.leads.filter(l=>(!f.q||(l.name+l.notes+l.city).toLowerCase().includes(f.q.toLowerCase()))&&(!f.country||l.country===f.country)&&(!f.niche||l.category===f.niche)&&(!f.level||l.level===f.level)&&(!f.status||l.status===f.status));
const u=k=>[...new Set(S.leads.map(l=>l[k]))];return `<h1>Saved Prospects</h1><div class="card"><div class="row"><div class="f"><input id="fq" placeholder="Search name, city, notes…" value="${esc(f.q)}"></div>
<div class="f"><select data-f="country"><option value="">All countries</option>${opts(u('country'),f.country)}</select></div><div class="f"><select data-f="niche"><option value="">All niches</option>${opts(u('category'),f.niche)}</select></div>
<div class="f"><select data-f="level"><option value="">Any score</option>${opts(['High','Medium','Low'],f.level)}</select></div><div class="f"><select data-f="status"><option value="">Any status</option>${opts(ST,f.status)}</select></div></div></div>
<div class="card ov">${a.length?`<table><tr><th>Business</th><th>Location</th><th>Score</th><th>Website</th><th>Status</th><th>Follow-up</th></tr>${a.map(l=>`<tr class="cl" data-a="open" data-id="${esc(l.id)}"><td><b>${esc(l.name)}</b><div class="sm mu">${esc(l.category)}</div></td><td>${esc(l.city)} ${esc(l.country)}</td><td><span class="tag ${l.level}">${l.score} ${l.level}</span></td><td>${stLabel[l.websiteStatus]}</td><td>${esc(l.status)}</td><td>${esc(l.followUpAt)}</td></tr>`).join('')}</table>`:'<div class="empty">No prospects match.</div>'}</div>`},
followups(){const due=S.leads.filter(l=>!['Rejected','Client'].includes(l.status)&&(l.followUpAt||['Contacted','Follow Up','Replied'].includes(l.status))).sort((a,b)=>(a.followUpAt||'9').localeCompare(b.followUpAt||'9'));
return `<h1>Follow-ups</h1><p class="mu">Prospects marked Rejected or Client never appear here. Never message anyone who asked you to stop.</p>${due.map(l=>`<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(l.name)}</b> <span class="tag">${esc(l.status)}</span> ${l.followUpAt&&l.followUpAt<=today()?'<span class="tag Low">Due</span>':''}<div class="sm mu">Last contacted: ${esc(l.contactedAt||'—')}</div></div>
<div class="row"><input type="date" style="width:auto" value="${esc(l.followUpAt)}" data-a="fdate" data-id="${esc(l.id)}"><button data-a="fu" data-n="1" data-id="${esc(l.id)}">1st follow-up</button><button data-a="fu" data-n="2" data-id="${esc(l.id)}">2nd follow-up</button><button data-a="dnc" data-id="${esc(l.id)}">Do not contact</button></div></div><div id="fu-${esc(l.id.replace(/\W/g,''))}"></div></div>`).join('')||'<div class="card empty">Nothing to follow up. Set a follow-up date on a prospect or mark it Contacted.</div>'}`},
settings(){const s=S.settings;return `<h1>Settings</h1><div class="card"><h2>Your details (used in messages and demos)</h2>${[['name','Your name'],['business','Your business / tagline'],['portfolio','Portfolio or website link'],['language','Message language (AI mode)']].map(([k,t])=>`<label>${t}</label><input data-s="${k}" value="${esc(s[k])}"><br><br>`).join('')}<button class="pri" data-a="savesettings">Save settings</button></div>
<div class="card"><h2>Integrations</h2><p class="sm">Lead search: <span class="tag High">OpenStreetMap — live, no key</span><br>AI writing: <span class="tag ${S.cfg.ai?'High':'Medium'}">${S.cfg.ai?'Gemini connected':'Demo mode — set GEMINI_API_KEY'}</span></p><p class="sm mu">Keys live in the server's <code>.env</code> file, never in the browser. See README.md.</p></div>`}};
function msgView(){const m=S.msg,l=L(S.sel);const b=(id,t)=>`<button data-copy="#${id}">${t}</button>`;return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(l.name)}</h2><span class="tag">${m.mode==='ai'?'AI-written':'Template'}</span></div>${m.warning?`<p class="sm" style="color:var(--y)">AI unavailable (${esc(m.warning)}) — showing template.</p>`:''}
<label>Email subject</label><input id="m0" value="${esc(m.subject)}"><br><br><label>Email</label><textarea id="m1">${esc(m.email)}</textarea><br><br><label>WhatsApp</label><textarea id="m2" style="min-height:90px">${esc(m.whatsapp)}</textarea><br><br><label>Instagram DM</label><textarea id="m3" style="min-height:90px">${esc(m.instagram)}</textarea><br><br>
<div class="row"><button data-a="cpmail">Copy Email</button>${b('m2','Copy WhatsApp Message')}${b('m3','Copy Instagram DM')}<button data-a="cpcontact">Copy Business Contact</button><button data-a="gen" data-next="1">Generate Another Message</button><button class="pri" data-a="markc">I sent it — mark Contacted</button></div>
<p class="sm mu">Nothing is sent automatically. ${l.email?`Email: ${esc(l.email)}`:'No public email found.'} ${l.phone?`Phone: ${esc(l.phone)}`:''}</p></div>`}
function demoView(){return `<div class="card"><div class="row"><button data-a="dw" data-w="100%">Desktop</button><button data-a="dw" data-w="390px">Mobile</button><button data-a="cpdemo">Copy code</button><button data-a="dldemo">Export .html</button><span class="tag">${S.demo.mode==='ai'?'AI copy':'Template copy'}</span></div><br><iframe id="fr" sandbox="" srcdoc="${esc(S.demo.html)}"></iframe></div>`}
function drawer(id){const l=L(id);if(!l)return;const d=document.createElement('div');d.className='modal';d.id='dr';d.innerHTML=`<div><div class="row" style="justify-content:space-between"><h1>${esc(l.name)}</h1><button data-a="close">✕</button></div><p class="mu sm">${esc(l.category)} · ${esc([l.address,l.city,l.country].filter(Boolean).join(', '))}</p>
<div class="row"><span class="tag ${l.level}">${l.score}/100 · ${l.level}</span><span class="tag">${stLabel[l.websiteStatus]}</span></div><ul class="sm">${l.why.concat(l.issues.filter(i=>!l.why.includes(i))).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
<div class="card sm">${[['Phone',l.phone,'tel:'+l.phone],['WhatsApp',l.whatsapp,'https://wa.me/'+l.whatsapp.replace(/\D/g,'')],['Email',l.email,'mailto:'+l.email],['Website',l.website,l.website],['Instagram',l.instagram,l.instagram],['Facebook',l.facebook,l.facebook]].map(([k,v,h])=>`${k}: ${v?`<a href="${esc(h)}" target="_blank" rel="noopener">${esc(v)}</a>`:'<span class="mu">not found publicly</span>'}<br>`).join('')}<a href="${esc(l.mapsUrl)}" target="_blank" rel="noopener">Search on Google Maps</a> · ${l.sources.map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener">Source listing</a>`).join('')}<br><span class="mu">${esc(l.description)}</span></div>
<label>Status</label><select id="d-status">${opts(ST,l.status)}</select><br><br><div class="row"><div class="f"><label>Date contacted</label><input type="date" id="d-con" value="${esc(l.contactedAt)}"></div><div class="f"><label>Follow-up date</label><input type="date" id="d-fu" value="${esc(l.followUpAt)}"></div></div><br><label>Notes</label><textarea id="d-notes">${esc(l.notes)}</textarea><br><br>
<div class="row"><button class="pri" data-a="savelead" data-id="${esc(l.id)}">Save</button><button data-a="msg" data-id="${esc(l.id)}">Message</button><button data-a="demo" data-id="${esc(l.id)}">Demo</button><button data-a="del" data-id="${esc(l.id)}">Delete</button></div></div>`;document.body.append(d)}
function render(){const p=PAGES[page()]?page():'dashboard';$('#nav').innerHTML=Object.entries(PAGES).map(([k,v])=>`<a href="#${k}" class="${k===p?'on':''}">${v}</a>`).join('');$('#main').innerHTML=R[p]();$('#main').style.animation='none';void $('#main').offsetWidth;$('#main').style.animation=''}
async function load(){try{[S.leads,S.settings,S.cfg]=await Promise.all([api('/api/leads'),api('/api/settings'),api('/api/config')])}catch(e){toast(e.message,1)}render()}
async function patch(id,b){const l=await api('/api/leads/'+encodeURIComponent(id),'PATCH',b);Object.assign(L(id),l);return l}
const fuText=(l,n)=>{const s=S.settings.name||'[Your name]';return n==1?`Hi, just following up on my previous message. I had an idea of how a website could help ${l.name} attract more customers online. Would you be open to seeing a quick example?\n\n${s}`:`Hi, I don't want to be a nuisance, so this is my last note. If a simple website for ${l.name} is something you'd like to see, I'm happy to send a free preview — and if now isn't the right time, no problem at all, just let me know and I won't message again.\n\n${s}`};
document.addEventListener('click',async e=>{const c=e.target.closest('[data-copy]');if(c)return copy($(c.dataset.copy).value);const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(t.tagName==='INPUT')return;
try{
if(a==='close')$('#dr')?.remove();
else if(a==='open')drawer(id);
else if(a==='msg'){$('#dr')?.remove();S.sel=id;S.msg=null;location.hash==='#messages'?render():location.hash='messages'}
else if(a==='demo'){$('#dr')?.remove();S.sel=id;S.demo=null;location.hash==='#demo'?render():location.hash='demo'}
else if(a==='search'){const q=S.q={country:$('#co').value.trim(),city:$('#ci').value.trim(),niche:$('#ni').value.trim(),limit:+$('#li').value};if(!q.country||!q.niche)return toast('Enter a country and a business niche',1);
 t.disabled=true;$('#out').innerHTML='<div class="card"><span class="spin"></span>Searching OpenStreetMap and checking each website… this can take up to a minute.</div>';
 try{const r=await api('/api/search','POST',q);S.leads=await api('/api/leads');S.res=r.leads;$('#out').innerHTML=r.leads.length?`<p class="sm mu">${r.leads.length} shown · ${r.added} new saved · ${r.scanned} scanned. Websites were checked automatically — verify before contacting.</p><div class="grid w">${r.leads.map(card).join('')}</div>`:`<div class="card empty">${esc(r.note)}</div>`}catch(x){$('#out').innerHTML=`<div class="card err">${esc(x.message)}</div>`}t.disabled=false}
else if(a==='gen'){S.sel=$('#lsel')?.value||S.sel;if(!S.sel)return toast('Select a prospect first',1);S.variant=t.dataset.next?S.variant+1:0;t.disabled=true;$('#mo').innerHTML='<div class="card"><span class="spin"></span>Writing…</div>';
 try{S.msg=await api('/api/messages','POST',{id:S.sel,variant:S.variant});if(L(S.sel).status==='New Lead')await patch(S.sel,{status:'Message Prepared'});$('#mo').innerHTML=msgView()}catch(x){$('#mo').innerHTML=`<div class="card err">${esc(x.message)}</div>`}t.disabled=false}
else if(a==='cpmail')copy(`Subject: ${$('#m0').value}\n\n${$('#m1').value}`,'Email copied');
else if(a==='cpcontact')copy(contactText(L(S.sel)),'Contact copied');
else if(a==='markc'){await patch(S.sel,{status:'Contacted',contactedAt:today(),followUpAt:today(5)});toast('Marked Contacted · follow-up in 5 days')}
else if(a==='mkdemo'){S.sel=$('#lsel').value||S.sel;if(!S.sel)return toast('Select a prospect first',1);t.disabled=true;$('#do').innerHTML='<div class="card"><span class="spin"></span>Building demo…</div>';try{S.demo=await api('/api/demo','POST',{id:S.sel});$('#do').innerHTML=demoView()}catch(x){$('#do').innerHTML=`<div class="card err">${esc(x.message)}</div>`}t.disabled=false}
else if(a==='dw')$('#fr').style.width=t.dataset.w;
else if(a==='cpdemo')copy(S.demo.html,'Code copied');
else if(a==='dldemo'){const u=URL.createObjectURL(new Blob([S.demo.html],{type:'text/html'})),x=document.createElement('a');x.href=u;x.download=(L(S.sel).name.replace(/\W+/g,'-').toLowerCase()||'demo')+'-demo.html';x.click()}
else if(a==='savelead'){await patch(id,{status:$('#d-status').value,notes:$('#d-notes').value,contactedAt:$('#d-con').value,followUpAt:$('#d-fu').value});if($('#d-status').value==='Contacted'&&!$('#d-con').value)await patch(id,{contactedAt:today()});if(['Rejected','Client'].includes($('#d-status').value))await patch(id,{followUpAt:''});$('#dr').remove();render();toast('Saved ✓')}
else if(a==='del'){if(confirm('Delete this prospect?')){await api('/api/leads/'+encodeURIComponent(id),'DELETE');S.leads=S.leads.filter(l=>l.id!==id);$('#dr').remove();render()}}
else if(a==='fu'){const l=L(id),n=t.dataset.n;const box=$('#fu-'+id.replace(/\W/g,''));box.innerHTML=`<br><textarea id="t${n}-${box.id}" style="min-height:110px">${esc(fuText(l,n))}</textarea><div class="row" style="margin-top:8px"><button data-copy="#t${n}-${box.id}">Copy</button><button data-a="fdone" data-id="${esc(id)}" data-n="${n}">Mark sent · remind in ${n==1?5:7} days</button></div>`}
else if(a==='fdone'){await patch(id,{status:'Follow Up',contactedAt:today(),followUpAt:today(t.dataset.n==1?5:7)});render();toast('Follow-up logged')}
else if(a==='dnc'){await patch(id,{status:'Rejected',followUpAt:''});render();toast('Marked Rejected — will not appear again')}
else if(a==='savesettings'){const b={};document.querySelectorAll('[data-s]').forEach(i=>b[i.dataset.s]=i.value);S.settings=await api('/api/settings','PUT',b);toast('Settings saved ✓')}
}catch(x){toast(x.message,1);t.disabled=false}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.f){S.f[t.dataset.f]=t.value;render()}if(t.dataset.a==='fdate'){await patch(t.dataset.id,{followUpAt:t.value});toast('Follow-up date saved ✓')}if(t.id==='lsel'){S.sel=t.value;S.msg=null;S.demo=null;$('#mo')&&($('#mo').innerHTML='');$('#do')&&($('#do').innerHTML='')}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){S.f.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#fq');i.focus();i.setSelectionRange(p,p)}});
addEventListener('hashchange',render);load();
</script></body></html>
